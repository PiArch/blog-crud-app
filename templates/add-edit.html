<!DOCTYPE html>
<html>
<head>
    <title>{% if post %}Edit{% else %}Add{% endif %} Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <h1>{% if post %}Edit{% else %}Create{% endif %} Blog Post</h1>

    <form method="post" enctype="multipart/form-data" class="card">

        <label>Title</label>
        <input type="text" name="title" value="{{ post.title if post }}" required>

        <label>Author</label>
        <input type="text" name="author" value="{{ post.author if post }}" required>

        <label>Content</label>
        <textarea name="content" rows="6" required>{{ post.content if post }}</textarea>

        <!-- IMAGE FIELD MOVED BELOW CONTENT -->
        <label>Image (Optional)</label>
        <input type="file" name="image">

        <button type="submit">Save Post</button>
    </form>

    <a class="back-link" href="/">← Back to Home</a>
</div>

</body>
</html>
